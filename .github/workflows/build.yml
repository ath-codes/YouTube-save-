name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: فك ضغط المشروع
        run: |
          set -e
          ZIP=$(ls *.zip | head -n 1)
          echo "Using: $ZIP"
          mkdir -p work
          unzip -q -o "$ZIP" -d work
          S=$(find work -maxdepth 3 -name settings.gradle.kts | head -n 1)
          test -n "$S" || { echo "settings.gradle.kts not found inside zip"; exit 1; }
          echo "PROJECT_DIR=$(cd "$(dirname "$S")" && pwd)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: بناء التطبيق
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: YTSave-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
